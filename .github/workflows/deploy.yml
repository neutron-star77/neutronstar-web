name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workers-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 每次构建按线上最新文章重新子集化中文字体，避免新增生僻字缺字；
      # 失败不阻断（回退仓库内已提交的子集 woff2）
      - name: Subset CJK font from latest posts
        run: node scripts/subset-font.mjs
        continue-on-error: true

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Workers（正式站 neutronstar.fun）
        run: pnpm dlx wrangler@4 deploy -c wrangler.deploy.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
